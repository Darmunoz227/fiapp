<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title class="ion-text-center" style="font-weight: bold; font-size: 20px; letter-spacing: 1px;">
      Fiapp - Mi Cuaderno de Fiados
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="irAConfiguraciones()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" color="light" class="ion-padding">
  
  <ion-card class="tarjeta-total">
    <ion-card-content>
      <ion-text color="medium">
        <p>💰 TOTAL QUE ME DEBEN</p>
      </ion-text>
      <ion-text color="danger">
        <h1 style="font-weight: bold; font-size: 28px; margin-top: 5px;">
          $ {{ formatearMonto(totalCartera) }} <span style="font-size: 16px; color: #666;">COP</span>
        </h1>
      </ion-text>
    </ion-card-content>
  </ion-card>

 <ion-searchbar placeholder="Buscar cliente..." mode="ios" (ionInput)="buscarCliente($event)"></ion-searchbar>

  <ion-list-header class="ion-no-padding" style="margin-bottom: 10px; padding-left: 10px;">
    <ion-label style="font-size: 12px; font-weight: bold; color: #888;">CLIENTES ACTIVOS</ion-label>
  </ion-list-header>

  <ion-list class="lista-clientes">
    <ion-item-sliding *ngFor="let cliente of clientesFiltrados">
      
      <ion-item lines="none" class="cliente-item" button="true" (click)="irADetalle(cliente.id)">
        <ion-avatar slot="start">
          <div class="avatar-placeholder">{{ cliente.nombre.charAt(0).toUpperCase() }}</div>
        </ion-avatar>
        <ion-label>
          <h2>{{ cliente.nombre }}</h2>
        </ion-label>
        <ion-note slot="end" [color]="cliente.deudaTotal <= 0 ? 'success' : 'danger'" class="deuda-texto">
          $ {{ formatearMonto(cliente.deudaTotal) }}
        </ion-note>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmarEliminarCliente(cliente)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="dark" (click)="abrirModalNuevoCliente()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
