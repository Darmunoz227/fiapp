<ion-header class="ion-no-border">
  <ion-toolbar color="dark" class="home-toolbar">
    <div class="custom-header-layout">
      <div class="app-branding">
        <span class="app-title">FiApp</span>
        <span class="app-subtitle">Mi Cuaderno de Fiados</span>
      </div>

      <div class="business-name" *ngIf="businessName">{{ businessName }}</div>

      <div class="header-actions">
        <ion-buttons>
          <ion-button (click)="irAConfiguraciones()">
            <ion-icon name="settings-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </div>
    </div>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" color="light" class="ion-padding">
  
  <div class="watermark-container">
    <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg" class="watermark-svg">
      <text x="100" y="50" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="2" fill="currentColor">FIAPP</text>
    </svg>
  </div>
  
  <ion-card class="tarjeta-total">
    <ion-card-content>
      <ion-text color="medium">
        <p>💰 TOTAL QUE ME DEBEN</p>
      </ion-text>
      <ion-text color="danger">
        <h1 style="font-weight: bold; font-size: 28px; margin-top: 5px;">
          $ {{ formatearMonto(totalCartera) }} <span style="font-size: 16px; color: #666;">COP</span>
        </h1>
      </ion-text>
    </ion-card-content>
  </ion-card>

 <ion-searchbar placeholder="Buscar cliente..." mode="ios" (ionInput)="buscarCliente($event)"></ion-searchbar>

  <ion-list-header class="ion-no-padding" style="margin-bottom: 10px; padding-left: 10px;">
    <ion-label style="font-size: 12px; font-weight: bold; color: #888;">CLIENTES ACTIVOS</ion-label>
  </ion-list-header>

  <ion-list class="lista-clientes">
    <ion-item *ngFor="let cliente of clientesFiltrados" lines="none" class="cliente-item" button="true" (click)="irADetalle(cliente.id)">
      <ion-avatar slot="start">
        <div class="avatar-placeholder">{{ cliente.nombre.charAt(0).toUpperCase() }}</div>
      </ion-avatar>
      <ion-label>
        <h2>{{ cliente.nombre }}</h2>
      </ion-label>
      <ion-note slot="end" [color]="cliente.deudaTotal <= 0 ? 'success' : 'danger'" class="deuda-texto">
        $ {{ formatearMonto(cliente.deudaTotal) }}
      </ion-note>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="dark" (click)="abrirModalNuevoCliente()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
